server:
  port: ${PORT:8080}
  error:
    include-message: never
  tomcat:
    threads:
      max: 20
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/documind}
    username: ${DB_USERNAME:documind}
    password: ${DB_PASSWORD:documind_dev_only}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
documind:
  ai-key: ${GEMINI_API_KEY:}
  ai-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  max-pages: 100
  max-characters: 60000
  daily-limit: ${DAILY_QUIZ_LIMIT:30}
  worker-enabled: ${WORKER_ENABLED:true}
