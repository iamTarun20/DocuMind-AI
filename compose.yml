# Local/private single-host packaging. For public hosting, use TLS and add real authentication.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U documind -d documind']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/documind
      DB_USERNAME: documind
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      DAILY_QUIZ_LIMIT: ${DAILY_QUIZ_LIMIT:-30}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:3000:80']
    depends_on: [backend]
volumes:
  pgdata:
